# Blueprint para o Render (https://render.com). O plano gratuito não guarda ficheiros entre
# reinícios, por isso define DATABASE_URL (ex.: PostgreSQL gratuito do Neon) para não perder as salas.
# TMDB_API_KEY (opcional) ativa as salas de séries e filmes: chave grátis em https://www.themoviedb.org/settings/api
# COMMUNITY_CODE (opcional) fecha a app a quem não souber o código da comunidade (só colaboradores).
# ADMINS (opcional): contas (utilizador ou email da conta Google) com a página de administração (/admin),
# que também podem apagar qualquer título ou foto na comunidade (ex.: goncalo.sousa@grupolusiaves.pt).
# GOOGLE_CLIENT_ID + GOOGLE_DOMAIN: "Continuar com Google", só para as contas Google do trabalho
# (@grupolusiaves.pt e @lusiaves.pt; outros domínios do grupo juntam-se com vírgulas). Vê o README.
# O Client ID não é secreto (aparece na página); o Client secret não é preciso.
services:
  - type: web
    # O nome dá o link (lusihub.onrender.com) e não se muda depois: outro nome cria outro serviço.
    name: lusihub
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: COMMUNITY_CODE
        sync: false
      - key: ADMINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: 54331493217-j8ipq4n6rrdfp5pqnhmoqklqvvsq8nd5.apps.googleusercontent.com
      - key: GOOGLE_DOMAIN
        value: grupolusiaves.pt,lusiaves.pt
