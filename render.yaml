# Blueprint para o Render (https://render.com). O plano gratuito não guarda ficheiros entre
# reinícios, por isso define DATABASE_URL (ex.: PostgreSQL gratuito do Neon) para não perder as salas.
# TMDB_API_KEY (opcional) ativa as salas de séries e filmes: chave grátis em https://www.themoviedb.org/settings/api
# COMMUNITY_CODE (opcional) fecha a app a quem não souber o código da comunidade (só colaboradores).
# ADMINS (opcional): contas que podem apagar qualquer título ou foto na comunidade (ex.: ana,rui).
services:
  - type: web
    # Nome de quando a app se chamava LusiMovies: mudá-lo cria outro serviço, com outro link.
    name: lusimovies
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: COMMUNITY_CODE
        sync: false
      - key: ADMINS
        sync: false
